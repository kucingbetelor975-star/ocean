[phases.setup]
nixPkgs = ["python3", "python3.pkgs.pip", "git", "git-lfs", "bash"]

[phases.install]
cmds = [
    "python3 -m pip install -r requirements.txt"
]

[phases.build]
cmds = [
    "chmod +x setup_model.sh",
    "bash setup_model.sh"
]

[start]
cmd = "python3 download_model.py && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 2"
